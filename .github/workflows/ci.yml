name: CI
run-name: CI for Build ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }}

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build]
    types: [completed]

# GitHub grants workflow_run jobs read-only cache access. The app reports these
# jobs on the source commit; no reporter credentials are passed to test runners.
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.path == '.github/workflows/build.yml' && github.event.workflow_run.head_repository.id == github.event.repository.id && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.artifacts.outputs.sha }}
    steps:
      - name: Identify the built commit
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Pull request builds use a merge SHA, which differs from head_sha.
          # Match scripts and binaries using the producing run's artifact names.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --slurp |
            jq -er '[.[].artifacts[] | select(.expired == false) | .name | select(test("^uv-linux-libc-[0-9a-f]{40}$")) | ltrimstr("uv-linux-libc-")] | unique | if length == 1 then .[0] else error("Expected one built commit") end')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Markdown backticks are literal.
          # shellcheck disable=SC2016
          printf 'Built commit: `%s`\n\n[Source build](%s/%s/actions/runs/%s)\n' "$sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  test-integration:
    needs: prepare
    uses: $/.github/workflows/test-integration.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      run-id: ${{ github.event.workflow_run.id }}

  test-smoke:
    needs: prepare
    uses: $/.github/workflows/test-smoke.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      run-id: ${{ github.event.workflow_run.id }}

  test-reporting:
    needs: prepare
    uses: $/.github/workflows/test-reporting.yml

  cache-access:
    name: Cache access after workflow_run
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create harmless cache marker
        run: echo demo > "$RUNNER_TEMP/cache-access-marker"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cache-access-marker
          key: workflow-run-demo-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
