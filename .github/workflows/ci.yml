name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-binaries:
    uses: $/.github/workflows/build-dev-binaries.yml

  cache-access:
    name: Cache access in the source run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create harmless cache marker
        run: echo demo > "$RUNNER_TEMP/cache-access-marker"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cache-access-marker
          key: workflow-run-demo-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  test-integration:
    name: integration tests
    needs: build-dev-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Wait for integration tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_RUN_NAME: Integration tests for CI ${{ github.run_id }}, attempt ${{ github.run_attempt }}
        run: |
          # The consumer waits for this job to start before downloading binaries.
          # Correlate the two workflows by run ID and attempt, not a moving branch.
          started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at)
          deadline=$((SECONDS + 1800))
          run_id=
          while (( SECONDS < deadline )); do
            if [[ -z "$run_id" ]]; then
              run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test-integration-workflow-run.yml/runs" \
                -f event=workflow_run -f "created=>=$started_at" -f per_page=100 --paginate --slurp | \
                jq -r '[.[].workflow_runs[] | select(.display_title == env.INTEGRATION_RUN_NAME) | .id] | min // empty')
              if [[ -z "$run_id" ]]; then
                sleep 30
                continue
              fi
              run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
              printf 'Integration tests: [workflow run](%s).\n\n' "$run_url" >> "$GITHUB_STEP_SUMMARY"
              echo "Waiting for $run_url"
            fi

            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            if [[ $(jq -r .status <<< "$run") != completed ]]; then
              sleep 30
              continue
            fi

            attempt=$(jq -r .run_attempt <<< "$run")
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" --paginate --slurp)
            printf '| Job | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[].jobs[] | "| [\(.name)](\(.html_url)) | \(.conclusion) |"' <<< "$jobs" >> "$GITHUB_STEP_SUMMARY"

            if [[ $(jq -r .conclusion <<< "$run") == success ]] && \
              jq -e '[.[].jobs[] | select(.name | startswith("test-integration /"))] | any(.conclusion == "success") and all(.conclusion == "success" or .conclusion == "skipped")' <<< "$jobs" > /dev/null; then
              exit 0
            fi
            echo '::error::Integration tests did not pass. See the job summary for individual results and logs.'
            exit 1
          done
          echo '::error::Timed out waiting for the integration workflow. Check that the workflow_run listener is enabled on the default branch.'
          exit 1
