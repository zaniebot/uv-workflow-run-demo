name: Integration tests
run-name: Integration tests for CI ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }}

on: # zizmor: ignore[dangerous-triggers]
  # The disposable repository accepts its own PRs to demonstrate the UI before
  # landing the main-push-only workflow in uv. It contains no registry credentials.
  workflow_run:
    workflows: [CI]
    types: [in_progress]

permissions:
  actions: read
  contents: read

concurrency:
  group: integration-tests-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ contains(fromJSON('["pull_request", "workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.head_repository.id == github.event.repository.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      run-tests: ${{ steps.claim.outputs.run-tests }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Ignore duplicate workflow notifications
        shell: bash
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_RUN_NAME: Integration tests for CI ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          # CI can enter in_progress again when a dependent job starts. Keep the
          # first consumer for each CI attempt; later notifications are no-ops.
          first_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test-integration-workflow-run.yml/runs" \
            -f event=workflow_run -f "created=>=$SOURCE_STARTED_AT" -f per_page=100 --paginate --slurp | \
            jq -er '[.[].workflow_runs[] | select(.display_title == env.INTEGRATION_RUN_NAME) | .id] | min // error("Integration run not found")')
          if [[ "$first_run" == "$GITHUB_RUN_ID" ]]; then
            echo 'run-tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run-tests=false' >> "$GITHUB_OUTPUT"
            echo "CI attempt is already handled by integration run $first_run"
          fi

      - name: Wait for binary builds
        shell: bash
        if: ${{ steps.claim.outputs.run-tests == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # CI's meta job starts only after all binary builds succeed. Waiting for
          # that job to start avoids waiting for CI itself, which waits for us.
          deadline=$((SECONDS + 2100))
          while (( SECONDS < deadline )); do
            source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
            if [[ $(jq -r .run_attempt <<< "$source_run") != "$SOURCE_RUN_ATTEMPT" || $(jq -r .status <<< "$source_run") == completed ]]; then
              echo '::error::The producing CI attempt ended before integration tests were ready.'
              exit 1
            fi
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" --paginate --slurp)
            status=$(jq -r '[.[].jobs[] | select(.name == "integration tests") | .status] | if length == 1 then .[0] elif length == 0 then empty else error("Multiple CI meta jobs matched") end' <<< "$jobs")
            if [[ "$status" == in_progress ]]; then
              exit 0
            elif [[ "$status" == completed ]]; then
              echo '::error::The CI meta job ended before integration tests were ready.'
              exit 1
            fi
            sleep 30
          done
          echo '::error::Timed out waiting for CI to finish building the binaries.'
          exit 1

      - name: Find the commit used for the source run's binaries
        if: ${{ steps.claim.outputs.run-tests == 'true' }}
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # On PRs, the artifact suffix is the merge SHA; head_sha is the PR head.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | test("^uv-linux-libc-[0-9a-f]{40}$"))) | .name | ltrimstr("uv-linux-libc-")] | unique | if length == 1 then .[0] else error("Expected one binary commit") end')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'Source: [CI run %s](%s), commit `%s`.\n' "$SOURCE_RUN_ID" "$SOURCE_RUN_URL" "$sha" >> "$GITHUB_STEP_SUMMARY"

  test-integration:
    needs: prepare
    if: ${{ needs.prepare.outputs.run-tests == 'true' }}
    uses: $/.github/workflows/test-integration.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      run-id: ${{ github.event.workflow_run.id }}

  cache-access:
    name: Cache access after workflow_run
    needs: prepare
    if: ${{ needs.prepare.outputs.run-tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create harmless cache marker
        run: echo demo > "$RUNNER_TEMP/cache-access-marker"
      # GitHub should reject this save while leaving the job successful.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cache-access-marker
          key: workflow-run-demo-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
