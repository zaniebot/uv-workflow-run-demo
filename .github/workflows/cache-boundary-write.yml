name: Cache boundary (write)
run-name: Cache boundary write on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      restore-key:
        description: Exact key of an earlier marker to look up
        type: string
      save:
        description: Attempt to save a fresh marker
        type: boolean
        default: true

permissions:
  contents: read
cache-mode: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-boundary
        with:
          restore-key: ${{ inputs.restore-key }}
          save: ${{ inputs.save }}
